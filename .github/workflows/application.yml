name: Application quality gates

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install checker dependencies
        run: sudo apt-get update && sudo apt-get install --yes jq ripgrep

      - name: Run documentation quality gates
        run: scripts/check-all.sh

  spike:
    name: Spike incrément 0 (Pest + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build and start stack
        run: |
          docker compose -f implementation/docker-compose.yml up -d --build
          docker compose -f implementation/docker-compose.yml exec -T postgres \
            sh -c 'until pg_isready -U atlas -d atlas; do sleep 1; done'

      - name: Install dependencies and run quality gates
        run: |
          docker compose -f implementation/docker-compose.yml exec -T app bash -c '
            set -euo pipefail
            cd /workspace/implementation/app
            composer install --no-interaction --prefer-dist
            cp -n .env.example .env
            php artisan key:generate --force --no-interaction
            npm ci --ignore-scripts
            npm audit --audit-level=high
            npm run typecheck
            npm run build
            php artisan migrate:fresh --force
            ./vendor/bin/pest --colors=never
          '

  e2e:
    name: Browser E2E (Playwright)
    needs: spike
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run browser E2E suite
        run: ./implementation/scripts/run-e2e.sh

  oci:
    name: OCI image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build application image with SBOM attestation
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # v6.17.0
        with:
          context: implementation
          file: implementation/Dockerfile
          target: runtime
          push: false
          tags: atlas-app:runtime
          sbom: true
          provenance: mode=max

  runtime-smoke:
    name: Immutable runtime smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUNTIME_APP_KEY: base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build and smoke test immutable application roles
        run: bash ./implementation/scripts/smoke-runtime.sh

  release-rehearsal:
    name: Release rehearsal (SEC-TEST-023)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install rehearsal dependencies
        run: sudo apt-get update && sudo apt-get install --yes jq ripgrep

      - name: Build and start stack
        run: |
          docker compose -f implementation/docker-compose.yml up -d --build
          docker compose -f implementation/docker-compose.yml exec -T postgres \
            sh -c 'until pg_isready -U atlas -d atlas; do sleep 1; done'

      - name: Seed database and run restore canary
        run: |
          docker compose -f implementation/docker-compose.yml exec -T app bash -c '
            set -euo pipefail
            cd /workspace/implementation/app
            composer install --no-interaction --prefer-dist
            cp -n .env.example .env
            php artisan key:generate --force --no-interaction
            php artisan migrate:fresh --force
            ./vendor/bin/pest tests/Architecture/ReferenceFixturesOracleTest.php --colors=never
          '
          ./implementation/scripts/backup-postgres.sh
          ./implementation/scripts/verify-restore-canary.sh

x-app-environment: &app-environment
  APP_ENV: ${ATLAS_SHARE_APP_ENV:-local}
  APP_DEBUG: ${ATLAS_SHARE_APP_DEBUG:-true}
  APP_URL: ${ATLAS_PUBLIC_URL:-http://localhost:8000}
  ATLAS_DEVELOPMENT_ROUTES: ${ATLAS_SHARE_DEVELOPMENT_ROUTES:-true}
  ATLAS_DEBUG_VERIFICATION_TOKENS: ${ATLAS_SHARE_DEBUG_VERIFICATION_TOKENS:-false}
  ATLAS_TRUST_PROXIES: ${ATLAS_SHARE_TRUST_PROXIES:-false}
  ATLAS_FORCE_HTTPS: ${ATLAS_SHARE_FORCE_HTTPS:-false}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: atlas
  DB_USERNAME: atlas
  DB_PASSWORD: atlas_dev
  OTEL_SERVICE_NAME: atlas-app
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
  LOG_CHANNEL: stack
  LOG_STACK: json_stderr
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  MAIL_FROM_ADDRESS: no-reply@atlas.local
  MAIL_FROM_NAME: Atlas
  MAIL_LINKS_URL: ${ATLAS_PUBLIC_URL:-http://localhost:8000}
  MAIL_MESSAGE_ID_DOMAIN: atlas.local

x-runtime-environment: &runtime-environment
  <<: *app-environment
  APP_ENV: ${RUNTIME_APP_ENV:-staging}
  APP_DEBUG: ${RUNTIME_APP_DEBUG:-false}
  APP_KEY: ${RUNTIME_APP_KEY:-}
  APP_URL: ${RUNTIME_APP_URL:-http://localhost:8080}
  ATLAS_DEVELOPMENT_ROUTES: "false"
  ATLAS_DEBUG_VERIFICATION_TOKENS: "false"
  ATLAS_TRUST_PROXIES: ${RUNTIME_TRUST_PROXIES:-false}
  ATLAS_FORCE_HTTPS: ${RUNTIME_FORCE_HTTPS:-false}
  MAIL_MAILER: ${RUNTIME_MAIL_MAILER:-log}
  MAIL_HOST: ${RUNTIME_MAIL_HOST:-mailpit}
  MAIL_PORT: ${RUNTIME_MAIL_PORT:-1025}
  MAIL_USERNAME: ${RUNTIME_MAIL_USERNAME:-}
  MAIL_PASSWORD: ${RUNTIME_MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${RUNTIME_MAIL_FROM_ADDRESS:-no-reply@atlas.local}
  MAIL_FROM_NAME: ${RUNTIME_MAIL_FROM_NAME:-Atlas}
  MAIL_LINKS_URL: ${RUNTIME_MAIL_LINKS_URL:-http://localhost:8080}
  MAIL_MESSAGE_ID_DOMAIN: ${RUNTIME_MAIL_MESSAGE_ID_DOMAIN:-atlas.local}

x-development-base: &development-base
  image: atlas-app:development
  build:
    context: .
    dockerfile: Dockerfile
    target: development
  working_dir: /workspace/implementation/app
  volumes:
    - ..:/workspace
  environment: *app-environment
  depends_on:
    postgres:
      condition: service_healthy
    mailpit:
      condition: service_started

x-runtime-base: &runtime-base
  image: atlas-app:runtime
  working_dir: /app
  depends_on:
    postgres:
      condition: service_healthy
  profiles: [runtime]
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  environment: *runtime-environment

services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
      - ./docker/postgres/init-roles.sql:/docker-entrypoint-initdb.d/02-roles.sql:ro
      - ./docker/postgres/init-test-database.sql:/docker-entrypoint-initdb.d/03-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    <<: *development-base
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:5173:5173"
    command: sleep infinity

  outbox-worker:
    <<: *development-base
    restart: unless-stopped
    command: >-
      sh -c 'until test -f vendor/autoload.php && php artisan migrate --force --no-interaction;
      do sleep 2; done;
      exec php artisan atlas:outbox:work --batch=100 --sleep=2'

  stripe-listener:
    image: stripe/stripe-cli:v1.50.4@sha256:af3692b018d5bc8df3fc0fe0fdacfac0f5b37cc875a6dfdb3d83d3db8d0442b8
    profiles: [stripe]
    init: true
    restart: unless-stopped
    environment:
      STRIPE_API_KEY: ${SUBSCRIPTIONS_STRIPE_SECRET_KEY:-}
    depends_on:
      app:
        condition: service_started
    command:
      - listen
      - --skip-update
      - --events
      - customer.subscription.created,customer.subscription.updated,customer.subscription.deleted,invoice.paid,invoice.payment_failed
      - --forward-to
      - http://app:8000/api/subscriptions/webhooks/stripe

  quick-tunnel:
    image: cloudflare/cloudflared:2026.7.2@sha256:4f6655284ab3d252b7f28fedb19fe6c8fc82ee5b1295c20ac74d475e5398a52d
    profiles: [share]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    depends_on:
      app:
        condition: service_started
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://app:8000

  e2e:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    profiles: [e2e]
    working_dir: /workspace/implementation/e2e
    volumes:
      - ..:/workspace
    network_mode: service:app
    environment:
      CI: "true"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
      PLAYWRIGHT_SKIP_WEBSERVER: "true"
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1

  api:
    <<: *runtime-base
    profiles: [runtime]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      <<: *runtime-environment
      OTEL_SERVICE_NAME: atlas-api
    ports:
      - "8080:8000"
    command: php artisan serve --no-reload --host=0.0.0.0 --port=8000
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10

  worker:
    <<: *runtime-base
    profiles: [runtime]
    environment:
      <<: *runtime-environment
      OTEL_SERVICE_NAME: atlas-worker
    command: php artisan atlas:outbox:work --batch=100 --sleep=2

  scheduler:
    <<: *runtime-base
    profiles: [runtime]
    environment:
      <<: *runtime-environment
      OTEL_SERVICE_NAME: atlas-scheduler
    command: php artisan schedule:work

  jaeger:
    profiles: [observability]
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686"
      - "4317:4317"

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4318:4318"
    depends_on:
      - jaeger

volumes:
  postgres_data:
